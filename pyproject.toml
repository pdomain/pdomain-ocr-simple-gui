[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pdomain-ocr-simple-gui"
dynamic = ["version"]
description = "Drag-and-drop OCR app — reference consumer of pdomain-ops LocalStageDispatcher"
authors = [
    { name = "CT", email = "concavetrillion@gmail.com" }
]
readme = "README.md"
license = { text = "Unlicense" }
requires-python = ">=3.11"
dependencies = [
    "pdomain-book-tools>=0.18.0",
    "pdomain-ops>=0.10.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiofiles>=23.2",
    "python-multipart>=0.0.29",
    "typing-extensions>=4.6",
    "python-statemachine>=3.1.2",
]

[project.scripts]
pdomain-ocr-simple-gui = "pdomain_ocr_simple_gui.__main__:main"

[project.urls]
Homepage = "https://github.com/pdomain/pdomain-ocr-simple-gui"
Repository = "https://github.com/pdomain/pdomain-ocr-simple-gui"

[dependency-groups]
dev = [
    "basedpyright>=1.39.4",
    "gitlint>=0.19.1",
    "pre-commit>=4.0",
    "psutil>=6.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.6",
    "ruff>=0.15.13",
    "httpx>=0.28",
]
e2e = [
    "pytest-playwright>=0.5",
]

[[tool.uv.index]]
name = "pdomain-index-pip"
url = "https://pdomain.github.io/pdomain-index-pip/simple/"
explicit = true

[tool.uv]
required-version = ">=0.11.16"

[tool.uv.sources]
pdomain-book-tools = { index = "pdomain-index-pip" }
pdomain-ops = { index = "pdomain-index-pip" }

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
# Include the gitignored Vite build output in BOTH the sdist and the wheel.
# The frontend/ directory is in .gitignore (generated artefact), so hatchling's
# default VCS-based file selection would silently omit it. Setting `artifacts`
# globally (not just in the wheel target) ensures:
#   1. The sdist contains src/pdomain_ocr_simple_gui/frontend/ (the built SPA).
#   2. The wheel built from that sdist also includes the frontend.
# Without this, `uv build` (default: sdist then wheel-from-sdist) produces a
# wheel with 0 frontend files even when `artifacts` is set only in the wheel
# target, because hatchling builds the wheel in a non-git temp dir from the
# sdist and applies the per-target artifact spec against that dir.
artifacts = ["src/pdomain_ocr_simple_gui/frontend/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdomain_ocr_simple_gui"]
# The global `artifacts` above also covers this target; no additional per-wheel
# artifacts needed. force-include is intentionally omitted to avoid duplicate
# path conflicts with the global artifacts spec.

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "B",
    "SIM",
    "UP",
    "RUF",
    "ERA",
    "T20",
    "ANN",
    "S",
    "C4",
    "PERF",
    "TC",
    "TID",
    "PT",
    "RET",
    "PL",
    "D",
    "BLE",
    "TRY",
    "LOG",
    "G",
]
ignore = [
    "B008",
    "UP042",
    "E501",
    "D203",
    "D212",
    "D100",
    "D104",
    "D107",
    "PLR0913",
    "PLR2004",
    "TRY003",
    "TRY301",
    "COM812",
    "PLC0415",
    "PLR0912",
    "PLR0911",
    "PLR0915",
    "ANN401",
    "D205",
    "D105",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741", "N806", "S101", "S104", "S105", "S106", "S301", "S311", "S603", "S607", "T201", "ANN", "D", "PLR2004", "PT011", "PT018", "S108", "PLR0133", "PLW2901", "PLW1510", "PERF401", "PERF402", "TRY", "BLE001", "TC"]
"scripts/*.py" = ["T201", "D", "ANN", "S603", "S607", "PLW1510"]
"**/__init__.py" = ["D104", "F401", "TC"]
"**/_*.py" = ["D"]
"src/pdomain_ocr_simple_gui/__main__.py" = ["ANN", "D", "T201"]

[tool.basedpyright]
include = ["src", "tests", "installer"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules"]
typeCheckingMode = "recommended"
failOnWarnings = true
reportImportCycles = "none"
venvPath = "."
venv = ".venv"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]

[[tool.basedpyright.executionEnvironments]]
root = "installer"
extraPaths = ["."]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=pdomain_ocr_simple_gui",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "-m", "not slow",
]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::ResourceWarning:coverage.*",
    'ignore:hf_xet\.download_files\(\) is deprecated:DeprecationWarning',
]
markers = [
    "slow: marks tests as slow (excluded from default make test run)",
    "e2e: marks tests as end-to-end (requires a running server and real OCR)",
    "real_ocr: marks Tier-B tests that exercise the REAL OCR engine (GPU, opt-in; never in default CI)",
]
