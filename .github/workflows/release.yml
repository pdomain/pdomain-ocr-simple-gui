name: release

# Dispatch-only release. Build + publish ONLY — no heavy CI gate runs on the
# GitHub runner (workspace policy). scripts/do-release.sh runs `make ci-slow`
# locally as the release preflight, pushes the exact tag, then triggers this
# workflow with the tag input below.
# Chore: review pinned action SHAs weekly. Update version comments and SHAs together.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v1.2.3"
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UV_PYTHON: "3.11"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v8.1.0
        with:
          version: "0.12.3"
      - name: Set up Python
        run: uv python install 3.11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.4.0
        with:
          node-version: "24"
      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Build release artifacts
        run: make build

      - name: List built artifacts
        run: ls -la dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ ${#wheels[@]} -ne 1 ] || [ ${#sdists[@]} -ne 1 ]; then
            echo "::error::expected exactly one wheel and one sdist under dist/"
            ls -la dist/
            exit 1
          fi
          files=("${wheels[@]}" "${sdists[@]}")
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --generate-notes \
            --verify-tag

      - name: Notify pd-index of new release
        env:
          GH_TOKEN: ${{ secrets.PDOMAIN_INDEX_DISPATCH }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PDOMAIN_INDEX_DISPATCH is not set; index will catch up via daily cron"
            exit 0
          fi
          gh api -X POST /repos/pdomain/pdomain-index-pip/dispatches \
            -f event_type=pdomain-release-published \
            -F 'client_payload[repo]=pdomain-ocr-simple-gui' \
            -F "client_payload[tag]=$RELEASE_TAG" || \
            echo "::warning::pdomain-index-pip dispatch failed; index will catch up via daily cron"
