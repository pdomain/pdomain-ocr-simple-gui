name: dep-refresh

on:
  schedule:
    - cron: '0 2 * * 0'   # Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.2
        with:
          token: ${{ secrets.DEP_REFRESH_TOKEN }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v8.1.0
        with:
          version: "0.12.10"

      - name: Set up Python
        run: uv python install 3.12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.4.0
        with:
          node-version: "24"

      - name: Set up pnpm or npm (repos with a package.json)
        if: hashFiles('frontend/package.json') != '' || hashFiles('package.json') != ''
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - name: Refresh GitHub Actions SHA pins
        run: uv run python scripts/update_github_actions.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upgrade all Python deps
        run: make upgrade-deps

      - name: Upgrade frontend npm deps (SPA repos)
        if: hashFiles('frontend/package.json') != ''
        # `pnpm update` bumps the specifier in package.json but does NOT
        # re-resolve `$var` overrides from pnpm-workspace.yaml into the
        # lockfile's `overrides:` block. That leaves package.json saying
        # react ^19.2.8 while the lockfile still records ^19.2.7, and CI's
        # frozen install then dies with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
        # The follow-up plain install re-resolves them. Every dep-refresh PR
        # opened before 2026-08-08 failed CI this way.
        run: |
          pnpm update --dir frontend
          pnpm install --dir frontend

      - name: Upgrade root npm deps
        if: hashFiles('package.json') != '' && hashFiles('frontend/package.json') == ''
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm update; else npm update; fi

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create branch, commit, and open PR
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="dep-refresh/$(date +%Y-%m-%d)-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: weekly dep refresh (actions pins + all deps)"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: weekly dep refresh" \
            --body "$(printf 'Automated weekly refresh:\n- GitHub Actions SHA pins\n- Python deps (uv lock --upgrade)\n- npm deps (pnpm/npm update)\n\nAuto-merge armed — merges when CI passes.')" \
            --base master \
            --head "$BRANCH" \
            --label dep-refresh
          gh pr merge --auto --rebase
        env:
          GH_TOKEN: ${{ secrets.DEP_REFRESH_TOKEN }}
