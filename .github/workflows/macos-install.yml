# Manual macOS install test. Start it with `just mac-test`.
#
# It installs the latest published release the way a user would, with
# install.sh -y, then runs scripts/windows_acceptance.py against the installed
# app in headless Chromium: upload, real OCR, edit, rerun and ZIP export.
# GitHub's macOS runners are Apple Silicon virtual machines; the job reports
# whether PyTorch sees MPS, and passes on the CPU path when it does not.
name: macOS install test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image (both are Apple Silicon)
        type: choice
        options:
          - macos-26
          - macos-15
        default: macos-26

permissions:
  contents: read

concurrency:
  group: macos-install-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Install and run acceptance on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      # install.sh asks the GitHub API for the latest release; the token
      # avoids the anonymous rate limit.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the acceptance script and fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Put uv's tool directory on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the latest release with install.sh
        run: sh install.sh -y

      - name: Report the installed environment
        run: |
          tool_python="$(uv tool dir)/pdomain-ocr-simple-gui/bin/python"
          "$tool_python" -I - <<'PY'
          import importlib.metadata as metadata
          import platform
          import sys

          import torch

          print("python", platform.python_version(), platform.machine())
          for name in ("pdomain-ocr-simple-gui", "pdomain-book-tools", "torch", "python-doctr"):
              print(name, metadata.version(name))
          print("mps available", torch.backends.mps.is_available())
          opencv = sorted(
              d.metadata["Name"]
              for d in metadata.distributions()
              if d.metadata["Name"].lower().startswith("opencv")
          )
          print("opencv distributions", opencv)
          if opencv != ["opencv-python"]:
              sys.exit(f"expected only opencv-python, found {opencv}")
          import cv2

          print("cv2", cv2.__version__)
          PY

      - name: Install Playwright's Chromium
        run: uv run --no-project --with playwright python -m playwright install chromium

      - name: Run the acceptance script against the installed app
        run: >-
          uv run --no-project --with playwright python -I scripts/windows_acceptance.py
          --headless --browser-channel chromium
          --exe "$HOME/.local/bin/pdomain-ocr-simple-gui"
          --out-dir acceptance-out

      - name: Keep the results, screenshots and server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-acceptance-${{ inputs.runner }}
          path: acceptance-out/
          if-no-files-found: ignore
