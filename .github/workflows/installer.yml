name: installer

# Builds the Linux AppImage installer and smoke-tests the engine logic.
# Triggered on workflow_dispatch (manual) or when release.yml publishes a
# GitHub Release.  ubuntu-latest only (v1); Windows/macOS deferred.
#
# The heavy `uv tool install` step is NOT exercised here — it would pull the
# real wheel from pdomain-index-pip and take minutes.  Instead, the engine
# logic (detect + plan + run) is tested in isolation via pytest with stubs.
# Estimated CI cost: ~4 billed minutes per release.
#
# Chore: review pinned action SHAs weekly. Update version comments and SHAs together.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3) — leave empty for branch test"
        required: false
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UV_PYTHON: "3.11"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  installer-smoke:
    name: Installer engine smoke + AppImage build
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # ── uv setup + cache ──────────────────────────────────────────────────
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.16"

      - name: Cache uv managed Python + packages
        uses: actions/cache@5a3ec84eff668545956fd18022155f7517b8fb01  # v4.2.3
        with:
          path: |
            ~/.local/share/uv
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # ── Python sync (dev group only — no e2e, no pnpm needed) ────────────
      - name: Install Python dev dependencies
        run: uv sync --group dev

      # ── Engine smoke tests (pure-Python, no subprocess calls) ────────────
      - name: Run installer engine tests
        run: uv run pytest tests/packaging/ -n auto -v

      # ── System deps for AppImage build ───────────────────────────────────
      - name: Install FUSE (required by appimagetool)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fuse libfuse2 || sudo apt-get install -y fuse2 || true

      # ── Build the AppImage (downloads appimagetool if absent) ────────────
      - name: Build Linux AppImage installer
        run: |
          chmod +x installer/build_appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 bash installer/build_appimage.sh
        continue-on-error: true  # AppImage build is best-effort on CI runners; engine tests are the gate

      - name: List dist artifacts
        if: always()
        run: ls -la dist/ 2>/dev/null || echo "No dist/ artifacts"
