name: installer

# Builds the Linux AppImage installer and smoke-tests the engine logic.
# Triggered on workflow_dispatch (manual) or by the release flow.
# ubuntu-latest only (v1); Windows/macOS deferred.
#
# The heavy `uv tool install` step is NOT exercised here — it would pull the
# real wheel from pdomain-index-pip and take minutes.  Instead, the engine
# logic (detect + plan + run) is tested in isolation via pytest with stubs.
# Estimated CI cost: ~4 billed minutes per release.
#
# Trigger note: release.yml dispatches this workflow via
#   gh workflow run installer.yml --ref "$RELEASE_BRANCH" -f "tag=$VERSION"
# Because release.yml uses GITHUB_TOKEN to create the Release, the GitHub API
# suppresses re-triggering the `release: published` event; the explicit
# workflow_dispatch is the reliable path.
#
# Chore: review pinned action SHAs weekly. Update version comments and SHAs together.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3) — leave empty for branch test"
        required: false
  release:
    types: [published]

permissions:
  contents: write  # Required for gh release upload

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UV_PYTHON: "3.11"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  installer-smoke:
    name: Installer engine smoke + AppImage build
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6.0.2

      # ── uv setup + native cache ──────────────────────────────────────────
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # ── Python sync (dev group only — no e2e, no pnpm needed) ────────────
      - name: Install Python dev dependencies
        run: uv sync --group dev

      # ── Engine smoke tests (pure-Python, no subprocess calls) ────────────
      - name: Run installer engine tests
        run: uv run pytest tests/packaging/ -n auto -v

      # ── Build the AppImage (type2 static runtime embedded) ─────────────────
      # build_appimage.sh sets APPIMAGE_EXTRACT_AND_RUN=1 internally for
      # appimagetool itself (build tool, a classic AppImage), then smoke-runs
      # the produced AppImage BARE to prove double-click works with no FUSE.
      # No env var needed here — the bare-run gate is inside the script.
      - name: Build Linux AppImage installer
        run: |
          chmod +x installer/build_appimage.sh
          bash installer/build_appimage.sh

      # ── Assert the AppImage was produced ──────────────────────────────────
      - name: Assert dist AppImage exists
        run: |
          if ! ls dist/*.AppImage 2>/dev/null; then
            echo "ERROR: No .AppImage found in dist/ after build step." >&2
            ls -la dist/ || true
            exit 1
          fi
          ls -lh dist/*.AppImage

      # ── Smoke-run: verify AppImage runs BARE (no env var = double-click gate) ─
      # The type2 static runtime self-extracts to $TMPDIR in pure userspace when
      # FUSE is unavailable.  Ubuntu runners may lack FUSE entirely — that is the
      # point: a bare run here proves the double-click path works on user machines.
      # Note: build_appimage.sh already ran a bare smoke-run; this step adds an
      # independent CI assertion with grep validation.
      - name: Smoke-run AppImage bare (proves double-click works, no FUSE needed)
        run: |
          APPIMAGE_FILE=$(ls dist/*.AppImage | head -1)
          echo "Testing (BARE run — no APPIMAGE_EXTRACT_AND_RUN): $APPIMAGE_FILE"
          OUTPUT=$("$APPIMAGE_FILE" --cli --dry-run 2>&1)
          echo "$OUTPUT"
          # Verify the expected plan text appears in the output
          echo "$OUTPUT" | grep -q "uv tool install" || {
            echo "ERROR: AppImage bare smoke-run did not contain expected 'uv tool install' text." >&2
            exit 1
          }
          echo "$OUTPUT" | grep -q "Dry-run mode" || {
            echo "ERROR: AppImage bare smoke-run did not contain 'Dry-run mode' confirmation." >&2
            exit 1
          }
          echo "Bare smoke-run passed — double-click path is verified."

      # ── Upload AppImage to the GitHub Release (tagged runs only) ─────────
      # Uploads when: (a) workflow_dispatch with a non-empty tag input, OR
      #               (b) triggered by the release event (tag_name is set).
      #
      # Fix C — upload race guard: installer.yml is dispatched CONCURRENTLY with
      # release.yml.  release.yml creates the GitHub Release; if installer.yml
      # reaches `gh release upload` before that step completes, the upload fails
      # with "release not found".  We poll up to 20 times (15 s each, ~5 min)
      # until the release exists, then upload.
      - name: Upload AppImage to GitHub Release
        if: >-
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') ||
          github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          APPIMAGE_FILE=$(ls dist/*.AppImage | head -1)

          # Poll for the GitHub Release to exist before uploading.
          # release.yml may not have created it yet when installer.yml runs concurrently.
          MAX_ATTEMPTS=20
          SLEEP_SECS=15
          attempt=0
          echo "Waiting for GitHub Release $TAG to exist (max ${MAX_ATTEMPTS} attempts x ${SLEEP_SECS}s)..."
          until gh release view "$TAG" >/dev/null 2>&1; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "ERROR: GitHub Release $TAG did not appear after $((MAX_ATTEMPTS * SLEEP_SECS))s." >&2
              echo "       release.yml may have failed or the tag may be wrong." >&2
              exit 1
            fi
            echo "  Release not found yet (attempt $attempt/$MAX_ATTEMPTS) — sleeping ${SLEEP_SECS}s..."
            sleep "$SLEEP_SECS"
          done
          echo "Release $TAG found. Uploading $APPIMAGE_FILE..."
          gh release upload "$TAG" "$APPIMAGE_FILE" --clobber
          echo "Upload complete."

      - name: List dist artifacts
        if: always()
        run: ls -la dist/ 2>/dev/null || echo "No dist/ artifacts"
